<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批次圖片壓縮 / Resize 工具</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#161513;
    --panel:#1f1e1b;
    --panel-2:#26251f;
    --line:#38362f;
    --text:#e9e5da;
    --text-dim:#a39d8e;
    --accent:#c1443a;
    --accent-soft:#c1443a33;
    --ok:#8a9a72;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, #2a2420 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:48px 24px 80px;
  }
  .wrap{max-width:860px;margin:0 auto;}

  header{margin-bottom:36px;}
  .kicker{
    color:var(--accent);
    font-size:13px;
    letter-spacing:.02em;
    margin:0 0 10px;
    font-family:var(--mono);
  }
  h1{
    font-size:30px;
    line-height:1.25;
    margin:0 0 12px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .sub{color:var(--text-dim);font-size:15px;line-height:1.6;max-width:56ch;}

  .controls{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    align-items:flex-end;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 20px;
    margin-bottom:22px;
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;color:var(--text-dim);}
  .field input, .field select{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:8px 10px;
    font-size:14px;
    font-family:var(--mono);
    width:120px;
  }
  .field select{font-family:var(--sans);width:150px;}
  .field input:focus, .field select:focus{outline:2px solid var(--accent-soft);outline-offset:1px;border-color:var(--accent);}

  .spacer{flex:1;}

  button{
    font-family:var(--sans);
    font-size:14px;
    font-weight:600;
    border-radius:7px;
    border:1px solid transparent;
    cursor:pointer;
    padding:10px 18px;
    transition:transform .08s ease, opacity .15s ease;
  }
  button:active{transform:scale(.97);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .btn-primary{background:var(--accent);color:#fff3ee;}
  .btn-primary:hover:not(:disabled){opacity:.9;}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--text);}
  .btn-ghost:hover:not(:disabled){border-color:var(--text-dim);}

  #dropzone{
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:40px 20px;
    text-align:center;
    color:var(--text-dim);
    cursor:pointer;
    margin-bottom:26px;
    transition:border-color .15s ease, background .15s ease;
  }
  #dropzone.drag{border-color:var(--accent);background:var(--accent-soft);color:var(--text);}
  #dropzone strong{color:var(--text);font-weight:600;}
  #dropzone .hint{font-size:13px;margin-top:6px;color:var(--text-dim);}

  #fileInput{display:none;}

  .toolbar{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .toolbar .count{font-family:var(--mono);font-size:13px;color:var(--text-dim);}

  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:14px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .thumb{
    aspect-ratio:4/3;
    background:#100f0d repeating-conic-gradient(#1a1917 0% 25%, #100f0d 0% 50%) 50%/16px 16px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .thumb img{width:100%;height:100%;object-fit:contain;}
  .card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;}
  .fname{
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .meta-row{
    display:flex;
    justify-content:space-between;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-dim);
  }
  .meta-row .after{color:var(--ok);}
  .meta-row .after.over{color:var(--accent);}
  .status{font-size:12px;color:var(--text-dim);font-family:var(--mono);}
  .card-actions{display:flex;gap:8px;margin-top:4px;}
  .card-actions button{padding:6px 10px;font-size:12px;flex:1;}

  .progress-bar{
    height:2px;background:var(--line);
    position:relative;overflow:hidden;
  }
  .progress-bar i{
    position:absolute;left:0;top:0;bottom:0;
    width:30%;background:var(--accent);
    animation:load 1s ease-in-out infinite;
  }
  @keyframes load{
    0%{left:-30%;}
    100%{left:100%;}
  }

  footer{
    margin-top:40px;
    color:var(--text-dim);
    font-size:12px;
    line-height:1.7;
    border-top:1px solid var(--line);
    padding-top:18px;
  }
  code{font-family:var(--mono);background:var(--panel-2);padding:1px 5px;border-radius:4px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="kicker">// batch image compressor</p>
    <h1>批次圖片壓縮工具</h1>
    <p class="sub">選擇多張圖片，工具會自動調整尺寸與畫質，讓每張圖片控制在指定的檔案大小以內，完成後可一鍵打包下載。所有處理都在你的瀏覽器裡完成，圖片不會被上傳到任何地方。</p>
  </header>

  <div class="controls">
    <div class="field">
      <label for="targetKB">目標大小上限 (KB)</label>
      <input type="number" id="targetKB" value="500" min="10" max="10000" step="10">
    </div>
    <div class="field">
      <label for="maxDim">最長邊上限 (px)</label>
      <input type="number" id="maxDim" value="2000" min="100" max="8000" step="100">
    </div>
    <div class="field">
      <label for="formatSel">輸出格式</label>
      <select id="formatSel">
        <option value="auto">自動 (JPEG，檔案較小)</option>
        <option value="png">PNG（保留透明背景）</option>
      </select>
    </div>
    <div class="spacer"></div>
    <button class="btn-primary" id="downloadAllBtn" disabled>下載全部 (ZIP)</button>
  </div>

  <div id="dropzone">
    <div><strong>點擊選擇圖片</strong>，或將圖片拖曳到這裡</div>
    <div class="hint">支援多選，JPG / PNG / WebP 皆可</div>
  </div>
  <input type="file" id="fileInput" accept="image/*" multiple>

  <div class="toolbar" id="toolbar" style="display:none;">
    <span class="count" id="countText">0 張圖片</span>
    <div class="spacer"></div>
    <button class="btn-ghost" id="clearBtn">清空</button>
  </div>

  <div id="grid"></div>

  <footer>
    運作方式：圖片會先照「最長邊上限」等比例縮小，接著反覆調整輸出畫質（JPEG 模式）或再次縮小尺寸，直到檔案小於設定的目標大小。若原圖本身已小於目標大小，會保留較高畫質。PNG 模式因為是無損格式，只會透過縮小尺寸來控制檔案大小。
  </footer>
</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const grid = document.getElementById('grid');
const toolbar = document.getElementById('toolbar');
const countText = document.getElementById('countText');
const downloadAllBtn = document.getElementById('downloadAllBtn');
const clearBtn = document.getElementById('clearBtn');
const targetKBInput = document.getElementById('targetKB');
const maxDimInput = document.getElementById('maxDim');
const formatSel = document.getElementById('formatSel');

let items = []; // {id, file, originalUrl, resultBlob, resultUrl, status, origSizeKB, newSizeKB, w, h}
let seq = 0;

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  handleFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
clearBtn.addEventListener('click', () => {
  items.forEach(it => { URL.revokeObjectURL(it.originalUrl); if (it.resultUrl) URL.revokeObjectURL(it.resultUrl); });
  items = [];
  render();
});

function handleFiles(fileList) {
  const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  files.forEach(file => {
    const id = 'f' + (seq++);
    const originalUrl = URL.createObjectURL(file);
    items.push({
      id, file, originalUrl,
      resultBlob: null, resultUrl: null,
      status: '等待處理', origSizeKB: file.size / 1024,
      newSizeKB: null, w: null, h: null
    });
  });
  render();
  processQueue();
}

function render() {
  toolbar.style.display = items.length ? 'flex' : 'none';
  countText.textContent = items.length + ' 張圖片';
  downloadAllBtn.disabled = !items.some(it => it.resultBlob);

  grid.innerHTML = '';
  items.forEach(it => {
    const card = document.createElement('div');
    card.className = 'card';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const img = document.createElement('img');
    img.src = it.resultUrl || it.originalUrl;
    thumb.appendChild(img);
    card.appendChild(thumb);

    if (it.status === '處理中') {
      const bar = document.createElement('div');
      bar.className = 'progress-bar';
      bar.innerHTML = '<i></i>';
      card.appendChild(bar);
    }

    const body = document.createElement('div');
    body.className = 'card-body';

    const fname = document.createElement('div');
    fname.className = 'fname';
    fname.textContent = it.file.name;
    body.appendChild(fname);

    const metaRow = document.createElement('div');
    metaRow.className = 'meta-row';
    const beforeSpan = document.createElement('span');
    beforeSpan.textContent = fmtKB(it.origSizeKB) + (it.w ? '' : '');
    const afterSpan = document.createElement('span');
    afterSpan.className = 'after';
    if (it.newSizeKB != null) {
      afterSpan.textContent = '→ ' + fmtKB(it.newSizeKB);
      const target = parseFloat(targetKBInput.value) || 500;
      if (it.newSizeKB > target) afterSpan.classList.add('over');
    } else {
      afterSpan.textContent = '';
    }
    metaRow.appendChild(beforeSpan);
    metaRow.appendChild(afterSpan);
    body.appendChild(metaRow);

    if (it.w) {
      const dimRow = document.createElement('div');
      dimRow.className = 'status';
      dimRow.textContent = it.w + ' × ' + it.h + 'px';
      body.appendChild(dimRow);
    } else {
      const st = document.createElement('div');
      st.className = 'status';
      st.textContent = it.status;
      body.appendChild(st);
    }

    const actions = document.createElement('div');
    actions.className = 'card-actions';
    const dlBtn = document.createElement('button');
    dlBtn.className = 'btn-ghost';
    dlBtn.textContent = '下載';
    dlBtn.disabled = !it.resultBlob;
    dlBtn.onclick = () => downloadSingle(it);
    const rmBtn = document.createElement('button');
    rmBtn.className = 'btn-ghost';
    rmBtn.textContent = '移除';
    rmBtn.onclick = () => removeItem(it.id);
    actions.appendChild(dlBtn);
    actions.appendChild(rmBtn);
    body.appendChild(actions);

    card.appendChild(body);
    grid.appendChild(card);
  });
}

function fmtKB(kb) {
  if (kb == null) return '';
  if (kb > 1024) return (kb/1024).toFixed(2) + ' MB';
  return Math.round(kb) + ' KB';
}

function removeItem(id) {
  const idx = items.findIndex(it => it.id === id);
  if (idx === -1) return;
  const it = items[idx];
  URL.revokeObjectURL(it.originalUrl);
  if (it.resultUrl) URL.revokeObjectURL(it.resultUrl);
  items.splice(idx, 1);
  render();
}

let processing = false;
async function processQueue() {
  if (processing) return;
  processing = true;
  const targetKB = parseFloat(targetKBInput.value) || 500;
  const maxDim = parseFloat(maxDimInput.value) || 2000;
  const format = formatSel.value;

  for (const it of items) {
    if (it.resultBlob || it.status === '處理中') continue;
    it.status = '處理中';
    render();
    try {
      const { blob, w, h } = await compressImage(it.file, targetKB, maxDim, format);
      it.resultBlob = blob;
      it.resultUrl = URL.createObjectURL(blob);
      it.newSizeKB = blob.size / 1024;
      it.w = w; it.h = h;
      it.status = '完成';
    } catch (err) {
      console.error(err);
      it.status = '失敗：' + err.message;
    }
    render();
  }
  processing = false;
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

async function compressImage(file, targetKB, maxDim, format) {
  const img = await loadImage(file);
  const targetBytes = targetKB * 1024;
  const hasAlpha = format === 'png';
  const mime = hasAlpha ? 'image/png' : 'image/jpeg';

  let scale = Math.min(1, maxDim / Math.max(img.width, img.height));
  let w = Math.round(img.width * scale);
  let h = Math.round(img.height * scale);

  function drawAt(w, h) {
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    if (!hasAlpha) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
    }
    ctx.drawImage(img, 0, 0, w, h);
    return canvas;
  }

  function canvasToBlob(canvas, quality) {
    return new Promise(resolve => {
      canvas.toBlob(b => resolve(b), mime, quality);
    });
  }

  if (hasAlpha) {
    // PNG: lossless, only dimension reduction controls size
    let canvas = drawAt(w, h);
    let blob = await canvasToBlob(canvas, 1);
    let guard = 0;
    while (blob.size > targetBytes && guard < 12 && Math.max(w, h) > 32) {
      w = Math.round(w * 0.85);
      h = Math.round(h * 0.85);
      canvas = drawAt(w, h);
      blob = await canvasToBlob(canvas, 1);
      guard++;
    }
    return { blob, w, h };
  }

  // JPEG: reduce quality first, then dimensions if still too big
  let canvas = drawAt(w, h);
  let quality = 0.92;
  let blob = await canvasToBlob(canvas, quality);

  let guard = 0;
  while (blob.size > targetBytes && guard < 25) {
    if (quality > 0.35) {
      quality -= 0.07;
    } else if (Math.max(w, h) > 64) {
      w = Math.round(w * 0.85);
      h = Math.round(h * 0.85);
      canvas = drawAt(w, h);
      quality = 0.6; // reset quality a bit after shrink, keeps visual quality reasonable
    } else {
      break; // can't reduce further
    }
    blob = await canvasToBlob(canvas, quality);
    guard++;
  }

  return { blob, w, h };
}

function downloadSingle(it) {
  if (!it.resultBlob) return;
  const a = document.createElement('a');
  a.href = it.resultUrl;
  a.download = outputName(it.file.name, it.resultBlob.type);
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function outputName(originalName, mime) {
  const ext = mime === 'image/png' ? '.png' : '.jpg';
  const base = originalName.replace(/\.[^.]+$/, '');
  return base + '_resized' + ext;
}

downloadAllBtn.addEventListener('click', async () => {
  const ready = items.filter(it => it.resultBlob);
  if (!ready.length) return;
  downloadAllBtn.disabled = true;
  downloadAllBtn.textContent = '打包中…';
  try {
    const zip = new JSZip();
    const usedNames = new Set();
    ready.forEach(it => {
      let name = outputName(it.file.name, it.resultBlob.type);
      let i = 1;
      while (usedNames.has(name)) {
        name = outputName(it.file.name, it.resultBlob.type).replace(/(\.\w+)$/, `_${i}$1`);
        i++;
      }
      usedNames.add(name);
      zip.file(name, it.resultBlob);
    });
    const content = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(content);
    a.download = 'resized_images.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
  } finally {
    downloadAllBtn.disabled = false;
    downloadAllBtn.textContent = '下載全部 (ZIP)';
  }
});

// Re-process already-queued (but not yet done) items if settings change before they finish;
// for already-completed items, changing settings does not retroactively reprocess them.
</script>
</body>
</html>
